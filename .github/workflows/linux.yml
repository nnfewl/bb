name: Linux binaries

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add "${{ matrix.target }}"
      - name: Test
        run: cargo test --locked --target "${{ matrix.target }}"
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Verify static linking
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/bb"
          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo 'Binary requires a dynamic linker' >&2
            exit 1
          fi
          if readelf -d "$binary" | grep -q '(NEEDED)'; then
            echo 'Binary requires shared libraries' >&2
            exit 1
          fi
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          archive="bb-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$archive" -C "target/${{ matrix.target }}/release" bb -C "$GITHUB_WORKSPACE" README.md COPYING bb.1
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: bb-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
